openapi: 3.1.0
info:
  title: Brasil Cred — Public REST API
  version: "1.0.0"
  summary: Consultas de crédito, veicular, jurídico, agro, cadastral e tributário em schema neutro.
  description: |
    API REST oficial Brasil Cred Consultas para parceiros B2B.

    - **Autenticação:** token `bc_live_*` via `Authorization: Bearer …` ou `X-API-Key`.
    - **Errors:** RFC 7807 Problem Details (`application/problem+json`).
    - **Idempotency:** obrigatório em todo `POST /consult/*` (header `Idempotency-Key`, janela 24h).
    - **Request correlation:** todo response carrega `X-Request-ID` (header) + `request_id` (body em erros).
    - **Rate limit:** 60 requests / minute por token.

    Documentação completa em https://brasilcred.com.br/api-public.md (download direto).
  contact:
    name: Brasil Cred Support
    url: https://brasilcred.com.br
  license:
    name: Proprietary
    identifier: LicenseRef-BrasilCred-Proprietary

servers:
  - url: https://sets.brasilcred.com.br/functions/v1/api-gateway/api/v1
    description: Production

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: Credit
    description: Relatórios de crédito (PF/PJ), score, scoring avançado
  - name: Scores & Bureaus
    description: Scores específicos e dados de bureaus
  - name: Restrictions
    description: Pendências, restrições, protestos, dívida ativa
  - name: Diagnostics
    description: Diagnósticos financeiros consolidados
  - name: Cadastral
    description: Dados cadastrais
  - name: Judicial
    description: Processos, ações judiciais, certidões
  - name: Agro
    description: Cadastros agrários (CAFIR, CAR)
  - name: Vehicle
    description: Consultas veiculares (CRLVe, gravame, leilão, etc)
  - name: Tributary
    description: Diagnóstico tributário PJ (SERPRO)
  - name: SPC
    description: Integração direta com SPC Brasil
  - name: Account
    description: Saldo, token info, histórico de consultas

paths:
  # ─── Account & History ────────────────────────────────────────────────────────
  /account:
    get:
      summary: Get current account info
      description: Saldo atual, info do token autenticado, uso mensal.
      operationId: getAccount
      tags: [Account]
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /consultations:
    get:
      summary: List past consultations
      description: |
        Lista consultas feitas via API token (consultas via web app são excluídas).
        Ordenadas da mais recente para a mais antiga.
      operationId: listConsultations
      tags: [Account]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationsListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /consultations/{id}:
    get:
      summary: Get consultation detail
      description: |
        Detalhes sanitizados de uma consulta. Retorna `404` se o id não pertence ao
        owner do token.

        **Polling de produtos assíncronos:** para o Radar PRONAMPE
        (`POST /consult/radar-pronampe`), este endpoint é o canal de polling.
        Enquanto `status` for `processing`, refaça a chamada (~10s) até virar
        `success` / `partial` / `error`. O corpo completo segue
        `RadarPronampeResult`.
      operationId: getConsultation
      tags: [Account]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationDetail'
              examples:
                radarPronampeCompleted:
                  summary: Radar PRONAMPE concluído (status success)
                  value:
                    consultation_id: 8b1f6c2e-3a4d-4e5f-9a6b-1c2d3e4f5a6b
                    product: financial_radar_pronampe
                    product_name: "Radar PRONAMPE (CNPJ)"
                    status: success
                    document: "12345678000190"
                    queried_at: "2026-06-15T13:42:07.512Z"
                    data_source: credit_bureau
                    score: { value: 305, range_min: 0, range_max: 1000, risk_level: medium }
                    credit_recommendation: { recommended_limit_brl: 2292, sale_recommendation: "Negocie a prazo", risk_level: medium }
                    credit_portfolio: { total_brl: 185673, active_contracts: 9, overdue_brl: 0, risk_level: medium }
                    federal_debts: { has_debt: false, count: 0 }
                    company:
                      size: "01"
                      main_activity_code: "6462000"
                      registration_status: "2"
                      opening_date: "2015-10-27"
                      share_capital_brl: 500000
                      simples_optant: false
                      mei_optant: false
                    clearance_certificate: { issued: true, status: issued }
                    payment_capacity: { monthly_capacity_brl: 12000, estimated_spend_brl: 8000 }
                    partners:
                      - { document_masked: "***.624.419-**", score: 926, has_restrictions: false }
                    result: { found: true, available: true }
                radarPronampeProcessing:
                  summary: Radar PRONAMPE em processamento (continue o polling)
                  value:
                    consultation_id: 8b1f6c2e-3a4d-4e5f-9a6b-1c2d3e4f5a6b
                    product: financial_radar_pronampe
                    product_name: "Radar PRONAMPE (CNPJ)"
                    status: processing
                    document: "12345678000190"
                    queried_at: "2026-06-15T13:42:07.512Z"
                    data_source: credit_bureau
                    result: { found: false, available: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─── Credit ───────────────────────────────────────────────────────────────────
  /consult/credit/pf:
    post:
      summary: Credit report (individual)
      description: Relatório premium de crédito para CPF (score, restrições, histórico).
      operationId: consultCreditPF
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
            example: { document: "12345678909" }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/UpstreamFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /consult/credit/pj:
    post:
      summary: Credit report (company)
      description: Idem `/consult/credit/pf` para CNPJ.
      operationId: consultCreditPJ
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CNPJRequest' }
            example: { document: "12345678000190" }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/UpstreamFailed' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /consult/premium-avancado/pf:
    post:
      summary: Premium Avançado (individual)
      description: Versão avançada do relatório premium para CPF, com bureau adicional.
      operationId: consultPremiumAvancadoPF
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/UpstreamFailed' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /consult/premium-avancado/pj:
    post:
      summary: Premium Avançado (company)
      operationId: consultPremiumAvancadoPJ
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CNPJRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/UpstreamFailed' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /consult/relatorio-especial/pf:
    post:
      summary: Relatório Especial (individual)
      description: Relatório especializado com pendências, ações e restrições aprofundadas.
      operationId: consultRelatorioEspecialPF
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/UpstreamFailed' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /consult/relatorio-especial/pj:
    post:
      summary: Relatório Especial (company)
      operationId: consultRelatorioEspecialPJ
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CNPJRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '502': { $ref: '#/components/responses/UpstreamFailed' }

  /consult/recomenda/pf:
    post:
      summary: Serasa Recomenda (individual)
      description: |
        Score Recomenda com análise contextual de risco.
        **Pode estar desabilitado dependendo do seu plano** — confirme com suporte.
      operationId: consultRecomendaPF
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /consult/recomenda/pj:
    post:
      summary: Serasa Recomenda (company)
      operationId: consultRecomendaPJ
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CNPJRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/complete/pf:
    post:
      summary: Consulta Completa (individual)
      description: |
        Bundle completo: credit + judicial + cadastral + score em uma única chamada.
        **Latência maior (~10-30s).** Use timeout ≥ 45s no cliente.
      operationId: consultCompletePF
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /consult/complete/pj:
    post:
      summary: Consulta Completa (company)
      operationId: consultCompletePJ
      tags: [Credit]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CNPJRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  # ─── Scores & Bureaus ─────────────────────────────────────────────────────────
  /consult/score:
    post:
      summary: Score V (Base V CPF e CNPJ)
      description: Score consolidado de múltiplos bureaus. Aceita CPF ou CNPJ.
      operationId: consultScore
      tags: [Scores & Bureaus]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/boa-vista:
    post:
      summary: Bureau IV + Score
      description: |
        Bureau IV com score próprio. **Pode estar oculto da plataforma**;
        consulte suporte se receber 404.
      operationId: consultBoaVista
      tags: [Scores & Bureaus]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /consult/avalie-credito:
    post:
      summary: Avalie Crédito
      description: Análise de crédito com recomendação.
      operationId: consultAvalieCredito
      tags: [Scores & Bureaus]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/credito-total:
    post:
      summary: Crédito Total + Score
      operationId: consultCreditoTotal
      tags: [Scores & Bureaus]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/scr-bacen:
    post:
      summary: SCR Bacen Detalhado
      description: |
        Sistema de Informações de Crédito do Banco Central.
        Aceita CPF ou CNPJ. Latência típica 5-15s.
      operationId: consultScrBacen
      tags: [Scores & Bureaus]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  # ─── Restrictions ─────────────────────────────────────────────────────────────
  /consult/popular:
    post:
      summary: Consulta Popular
      description: |
        **Status: oculto da plataforma desde 2026-05-22.**
        Pode retornar 404 ou estar indisponível.
      operationId: consultPopular
      tags: [Restrictions]
      deprecated: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '404': { $ref: '#/components/responses/NotFound' }

  /consult/ccf:
    post:
      summary: CCF — Cheque sem Fundo
      description: Histórico de cheques sem fundo (CCF) registrados.
      operationId: consultCcf
      tags: [Restrictions]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/cadin:
    post:
      summary: CADIN Secretaria da Fazenda
      description: |
        Cadastro de Inadimplentes da Secretaria da Fazenda.
        **Requer `state` (UF de 2 letras) no body.**
      operationId: consultCadin
      tags: [Restrictions]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CPFRequest'
                - type: object
                  required: [state]
                  properties:
                    state:
                      type: string
                      pattern: '^[A-Z]{2}$'
                      example: SP
                      description: Sigla da UF (2 letras maiúsculas)
            example: { document: "12345678909", state: "SP" }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '400':
          description: Bad request — sem `state` válido (UF de 2 letras)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/protestos:
    post:
      summary: Protestos Nacional (IEPTB)
      description: Protestos registrados nacionalmente via IEPTB.
      operationId: consultProtestos
      tags: [Restrictions]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/pgfn:
    post:
      summary: PGFN Lista de Devedores da União
      description: Dívida ativa da União. Aceita CPF ou CNPJ.
      operationId: consultPgfn
      tags: [Restrictions]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/indicadores:
    post:
      summary: Indicadores Sociodemográficos + Score
      description: Indicadores agregados de risco sociodemográfico.
      operationId: consultIndicadores
      tags: [Restrictions]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  # ─── Diagnostics ──────────────────────────────────────────────────────────────
  /consult/diagnostico/pf:
    post:
      summary: Diagnóstico Financeiro Avançado (individual)
      description: |
        Análise consolidada com SCR Bacen + score + restrições + recomendação.
        **Latência típica 15-30s.** Use timeout ≥ 45s.
      operationId: consultDiagnosticoPF
      tags: [Diagnostics]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /consult/diagnostico/pj:
    post:
      summary: Diagnóstico Financeiro Avançado (company)
      operationId: consultDiagnosticoPJ
      tags: [Diagnostics]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CNPJRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /consult/diagnostico-premium:
    post:
      summary: Diagnóstico Financeiro Premium
      description: Diagnóstico premium com motor de crédito proprietário + SCR Bacen + bureau adicional.
      operationId: consultDiagnosticoPremium
      tags: [Diagnostics]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/diagnostico-locacao:
    post:
      summary: Diagnóstico para Locação Imobiliário
      description: Análise específica para mercado de locação residencial/comercial.
      operationId: consultDiagnosticoLocacao
      tags: [Diagnostics]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPFRequest' }
      responses:
        '201': { $ref: '#/components/responses/ConsultationCreated' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }

  /consult/radar-pronampe:
    post:
      summary: Radar PRONAMPE (company) — async
      description: |
        **Consulta assíncrona.** Análise composta de crédito PJ (score, recomendação,
        carteira BACEN SCR, dívida federal, cadastro, certidão de regularidade,
        capacidade de pagamento e perfil dos sócios) voltada à elegibilidade ao PRONAMPE.

        Retorna **`202 Accepted`** com `consultation_id`; faça polling em
        `GET /consultations/{id}` até o `status` sair de `processing` (vira
        `success` / `partial` / `error`). Use `retry_after_seconds` (≈10s) como
        intervalo de polling. **CNPJ-only.** **Cobrança no aceite (202)** — o débito
        ocorre quando a consulta é aceita, não quando o resultado fica pronto.

        Retry idempotente (mesma `Idempotency-Key`) enquanto processa retorna `202`
        novamente e **nunca recobra**.
      operationId: consultRadarPronampe
      tags: [Diagnostics]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CNPJRequest' }
            example: { document: "12345678000190" }
      responses:
        '202': { $ref: '#/components/responses/ConsultationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientBalance' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/UpstreamFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

