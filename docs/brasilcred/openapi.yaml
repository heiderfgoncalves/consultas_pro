# ────────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bc_live_*
      description: |
        Token raw `bc_live_…` no header `Authorization: Bearer …`.
        Veja seção "Authentication" da referência completa: https://brasilcred.com.br/api-public.md
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Token raw `bc_live_…` no header `X-API-Key`. Equivalente ao Bearer.

  headers:
    XRequestID:
      description: |
        UUID v4 único do request. Echoed em toda response. Pode ser passado inbound
        se for UUID-like (preservamos); caso contrário gerado server-side.
      schema: { type: string, format: uuid }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave única de idempotency, 16-64 chars `[A-Za-z0-9_-]`. UUIDv4 e ULID qualificam.
        Mesma key dentro de 24h retorna resultado cached sem re-cobrar.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{16,64}$'
        example: 5e9a3f2c-1b8d-4f6e-9c7a-2d5b8e3f1a9c

  schemas:
    DocumentRequest:
      type: object
      required: [document]
      properties:
        document:
          type: string
          description: CPF (11 dígitos), CNPJ (14 dígitos), ou placa veicular
          example: "12345678909"

    CPFRequest:
      type: object
      required: [document]
      properties:
        document:
          type: string
          pattern: '^\d{11}$'
          description: CPF — 11 dígitos sem máscara
          example: "12345678909"

    CNPJRequest:
      type: object
      required: [document]
      properties:
        document:
          type: string
          pattern: '^\d{14}$'
          description: CNPJ — 14 dígitos sem máscara
          example: "12345678000190"

    PlateRequest:
      type: object
      required: [document]
      properties:
        document:
          type: string
          description: Placa veicular (formato Mercosul ou pré-Mercosul)
          example: "ABC1234"

    AccountResponse:
      type: object
      required: [balance, api_token, usage]
      properties:
        balance:
          type: object
          properties:
            available_cents: { type: integer, example: 55945 }
            available_brl:   { type: string,  example: "559.45" }
        api_token:
          type: object
          properties:
            name:         { type: string, example: "Prod" }
            last_used_at: { type: string, format: date-time }
            created_at:   { type: string, format: date-time }
        usage:
          type: object
          properties:
            this_month: { type: integer, example: 9 }

    ConsultationsListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ConsultationSummary' }
        pagination:
          type: object
          properties:
            page:        { type: integer, example: 1 }
            limit:       { type: integer, example: 20 }
            total:       { type: integer, example: 142 }
            total_pages: { type: integer, example: 8 }

    ConsultationSummary:
      type: object
      properties:
        id:         { type: string, format: uuid }
        product:
          type: string
          description: Vendor-neutral product identifier
          enum:
            - credit_report_individual
            - credit_report_company
            - credit_report_complete_individual
            - credit_report_complete_company
            - credit_score
            - vehicle_report
            - financial_radar_pronampe
            - consultation
        document:   { type: string }
        status:
          type: string
          description: |
            Estado público da consulta. `processing` aparece apenas em produtos
            assíncronos (Radar PRONAMPE) enquanto o job roda. Estados internos
            (`pending`, `error_refund_pending`, `error_refund_failed`) nunca são
            serializados na API.
          enum: [success, partial, error, processing]
        queried_at: { type: string, format: date-time }

    ConsultationDetail:
      type: object
      description: Detalhes sanitizados (sem nomes de vendor). Shape espelha o response de `POST /consult/<product>`.

    ConsultationResult:
      type: object
      required: [consultation_id, product_name]
      properties:
        consultation_id:
          type: string
          format: uuid
          description: ID para `GET /consultations/{id}` ou rastreio em suporte
        product_name:
          type: string
          description: Nome comercial do produto
          example: "CADIN — Secretaria da Fazenda"
        data:
          type: object
          description: Conteúdo do resultado, sanitizado de nomes de vendor underlying

    ConsultationAcceptedResult:
      type: object
      description: |
        Corpo retornado com **`202 Accepted`** por um produto assíncrono
        (Radar PRONAMPE) quando a consulta é aceita e o job de background começa
        a rodar. Carrega apenas metadados de ciclo de vida + a URL de polling —
        **nunca** dados do provedor. O mesmo shape é devolvido tanto na primeira
        chamada quanto no replay idempotente enquanto o job ainda processa.
      required: [product, status, document, queried_at, poll_url, retry_after_seconds, result, data_source]
      properties:
        consultation_id:
          type: string
          format: uuid
          description: |
            ID da consulta para o polling em `GET /consultations/{id}`. Pode estar
            ausente apenas em replays raros em que o id não pôde ser recuperado —
            nesse caso use `poll_url` (que aponta para a lista).
        product:
          type: string
          const: financial_radar_pronampe
          description: Identificador neutro do produto.
        product_name:
          type: string
          example: "Radar PRONAMPE (CNPJ)"
        status:
          type: string
          const: processing
          description: Sempre `processing` no 202 — o resultado ainda não está pronto.
        document:
          type: string
          description: CNPJ consultado (14 dígitos).
          example: "12345678000190"
        queried_at:
          type: string
          format: date-time
        poll_url:
          type: string
          description: |
            Caminho relativo para acompanhar o job. `GET /consultations/{id}`
            quando o id é conhecido; caso contrário `/api/v1/consultations`.
          example: "/api/v1/consultations/8b1f6c2e-3a4d-4e5f-9a6b-1c2d3e4f5a6b"
        retry_after_seconds:
          type: integer
          description: Intervalo sugerido de polling, em segundos.
          example: 10
        result:
          type: object
          required: [available]
          properties:
            available:
              type: boolean
              const: false
              description: Sempre `false` enquanto processa — sem dados ainda.
            summary:
              type: string
              example: >-
                Consulta assíncrona aceita e em processamento. Acompanhe pelo poll_url
                até que o status mude de "processing" para "success"/"partial".
        data_source:
          type: string
          example: credit_bureau

    RadarPronampeResult:
      type: object
      description: |
        Shape COMPLETO (vendor-neutral, whitelist-only) retornado por
        `GET /consultations/{id}` quando o job do Radar PRONAMPE termina. Todo bloco
        analítico é **opcional** — só aparece quando a perna correspondente trouxe
        dado. Enquanto `status` for `processing`, apenas os campos de envelope
        aparecem (sem blocos), com `result.available=false`. Nenhum dado bruto de
        provedor, razão social, e-mail, telefone, endereço, CPF completo ou nome de
        modelo é exposto — por construção.
      required: [consultation_id, product, product_name, status, document, queried_at, data_source, result]
      properties:
        consultation_id:
          type: string
          format: uuid
        product:
          type: string
          const: financial_radar_pronampe
        product_name:
          type: string
          const: "Radar PRONAMPE (CNPJ)"
        status:
          type: string
          enum: [success, partial, error, processing]
          description: |
            `processing` = job em andamento; `success` = completo; `partial` =
            âncora entregue mas ≥1 bloco complementar faltou (faturável, sem
            estorno); `error` = falha que disparou estorno automático.
        document:
          type: string
          description: CNPJ consultado (14 dígitos).
          example: "12345678000190"
        queried_at:
          type: string
          format: date-time
        data_source:
          type: string
          const: credit_bureau
        score:
          type: object
          description: Score de crédito da empresa (0–1000).
          properties:
            value:      { type: integer, example: 305 }
            range_min:  { type: integer, const: 0 }
            range_max:  { type: integer, const: 1000 }
            risk_level: { type: string, example: medium }
        credit_recommendation:
          type: object
          description: Recomendação de crédito sintetizada.
          properties:
            recommended_limit_brl: { type: number, description: Limite recomendado em R$ (0 = não recomenda), example: 2292 }
            sale_recommendation:   { type: string, example: "Negocie a prazo" }
            risk_level:            { type: string, example: medium }
        credit_portfolio:
          type: object
          description: Carteira de crédito bancária (BACEN SCR), em R$.
          properties:
            total_brl:        { type: number, example: 185673 }
            active_contracts: { type: integer, example: 9 }
            overdue_brl:      { type: number, example: 0 }
            risk_level:       { type: string, example: medium }
        federal_debts:
          type: object
          description: Dívida ativa da União (PGFN).
          properties:
            has_debt: { type: boolean, example: false }
            count:    { type: integer, example: 0 }
        company:
          type: object
          description: Cadastro consolidado (Receita Federal), sem PII.
          properties:
            size:                { type: string, description: 'Código de porte ("01"=ME, "03"=EPP, "05"=Demais)', example: "01" }
            main_activity_code:  { type: string, description: Código CNAE principal, example: "6462000" }
            registration_status: { type: string, description: 'Código da situação cadastral ("2"=ativa)', example: "2" }
            opening_date:        { type: string, example: "2015-10-27" }
            share_capital_brl:   { type: number, description: Capital social em R$, example: 500000 }
            simples_optant:      { type: boolean, example: false }
            mei_optant:          { type: boolean, example: false }
        clearance_certificate:
          type: object
          description: Certidão de regularidade fiscal (CND).
          properties:
            issued: { type: boolean, example: true }
            status: { type: string, enum: [issued, not_issued], example: issued }
        payment_capacity:
          type: object
          description: Capacidade mensal de pagamento e gasto estimado, em R$.
          properties:
            monthly_capacity_brl: { type: number, example: 12000 }
            estimated_spend_brl:  { type: number, example: 8000 }
        partners:
          type: array
          description: |
            Sócios — apenas documento **mascarado** e flag booleana de restrição
            (LGPD; dado de terceiro). Nunca CPF completo nem relatório do sócio.
          items:
            type: object
            properties:
              document_masked:  { type: string, example: "***.624.419-**" }
              score:            { type: integer, example: 926 }
              has_restrictions: { type: boolean, example: false }
        result:
          type: object
          required: [found, available]
          properties:
            found:     { type: boolean, example: true }
            available: { type: boolean, example: true }
      example:
        consultation_id: 8b1f6c2e-3a4d-4e5f-9a6b-1c2d3e4f5a6b
        product: financial_radar_pronampe
        product_name: "Radar PRONAMPE (CNPJ)"
        status: success
        document: "12345678000190"
        queried_at: "2026-06-15T13:42:07.512Z"
        data_source: credit_bureau
        score: { value: 305, range_min: 0, range_max: 1000, risk_level: medium }
        credit_recommendation: { recommended_limit_brl: 2292, sale_recommendation: "Negocie a prazo", risk_level: medium }
        credit_portfolio: { total_brl: 185673, active_contracts: 9, overdue_brl: 0, risk_level: medium }
        federal_debts: { has_debt: false, count: 0 }
        company:
          size: "01"
          main_activity_code: "6462000"
          registration_status: "2"
          opening_date: "2015-10-27"
          share_capital_brl: 500000
          simples_optant: false
          mei_optant: false
        clearance_certificate: { issued: true, status: issued }
        payment_capacity: { monthly_capacity_brl: 12000, estimated_spend_brl: 8000 }
        partners:
          - { document_masked: "***.624.419-**", score: 926, has_restrictions: false }
        result: { found: true, available: true }

    ProblemDetails:
      type: object
      description: |
        RFC 7807 Problem Details. Toda resposta non-2xx segue este formato com
        `Content-Type: application/problem+json`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI estável do erro
          example: https://brasilcred.com.br/errors/bad_request
        title:
          type: string
          description: Resumo human-readable
          example: Invalid request
        status:
          type: integer
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Descrição acionável, sanitizada
          example: "Field 'document' is required (CPF, CNPJ, or vehicle plate)."
        request_id:
          type: string
          format: uuid
          description: |
            UUID do request — também presente no header `X-Request-ID`. Incluir em tickets de suporte.
          example: 1000fb8b-ddf0-4640-91b8-57d15c872a66
        current_balance_cents:
          type: integer
          description: Saldo atual (presente em 402 insufficient_balance)
          example: 180
        required_cents:
          type: integer
          description: Preço do produto (presente em 402 insufficient_balance)
          example: 357
        refund_consultation_id:
          type: string
          format: uuid
          description: ID da consulta para tracking do refund (presente em 502 upstream_failed quando aplicável)

  responses:
    ConsultationCreated:
      description: Consulta criada com sucesso, balance debitado
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConsultationResult' }

    ConsultationAccepted:
      description: |
        202 — consulta assíncrona aceita e **cobrada no aceite**. O job de background
        está rodando. Faça polling em `poll_url` (= `GET /consultations/{id}`) até o
        `status` sair de `processing`. Use o header `Retry-After` (ou o campo
        `retry_after_seconds` do corpo) como intervalo de polling. Replay idempotente
        enquanto processa retorna este mesmo 202, sem nova cobrança.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          schema: { type: integer, example: 10 }
          description: Segundos sugeridos antes do próximo polling em `GET /consultations/{id}`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConsultationAcceptedResult' }
          example:
            consultation_id: 8b1f6c2e-3a4d-4e5f-9a6b-1c2d3e4f5a6b
            product: financial_radar_pronampe
            product_name: "Radar PRONAMPE (CNPJ)"
            status: processing
            document: "12345678000190"
            queried_at: "2026-06-15T13:42:07.512Z"
            poll_url: "/api/v1/consultations/8b1f6c2e-3a4d-4e5f-9a6b-1c2d3e4f5a6b"
            retry_after_seconds: 10
            result:
              available: false
              summary: >-
                Consulta assíncrona aceita e em processamento. Acompanhe pelo poll_url
                até que o status mude de "processing" para "success"/"partial".
            data_source: credit_bureau

    BadRequest:
      description: 400 — body malformado, campo obrigatório ausente, ou JSON inválido
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: https://brasilcred.com.br/errors/bad_request
            title: Invalid request
            status: 400
            detail: "Field 'document' is required (CPF, CNPJ, or vehicle plate)."
            request_id: a3f8b2e1-9c4d-4e5f-8a6b-1c2d3e4f5a6b

    Unauthorized:
      description: 401 — token ausente, malformado, inativo ou inexistente
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: https://brasilcred.com.br/errors/unauthorized
            title: Authentication required
            status: 401
            detail: "Provide a valid API token via Authorization: Bearer bc_live_… or X-API-Key header."
            request_id: a3f8b2e1-9c4d-4e5f-8a6b-1c2d3e4f5a6b

    InsufficientBalance:
      description: 402 — saldo < preço. Top up e retry com mesma Idempotency-Key.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: https://brasilcred.com.br/errors/insufficient_balance
            title: Insufficient balance
            status: 402
            detail: "Insufficient balance to perform this consultation. Top up your balance and retry with the same Idempotency-Key."
            current_balance_cents: 180
            required_cents: 357
            request_id: b4c9d2e3-1f5a-4b6c-9d8e-7f6a5b4c3d2e

    NotFound:
      description: 404 — endpoint inexistente ou recurso não pertence ao token autenticado
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

    Conflict:
      description: 409 — mesma Idempotency-Key usada com payload diferente
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

    Unprocessable:
      description: 422 — documento bem-formado mas semanticamente inválido (DV errado, etc)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

    RateLimited:
      description: 429 — mais de 60 req/min para este token
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          schema: { type: integer, example: 60 }
          description: Segundos a aguardar antes de retry
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

    UpstreamFailed:
      description: |
        502 — provedor falhou após o débito. Refund automático em curso (server-side retry,
        max 5 tentativas em 25min). Não retry com a mesma Idempotency-Key. Ou, sub-tipo
        `upstream_misconfigured`: auth interno desconfigurado (nosso bug); reporte com request_id.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: https://brasilcred.com.br/errors/upstream_failed
            title: Upstream provider failed
            status: 502
            detail: "The data provider returned an error. Your balance refund is being processed automatically."
            refund_consultation_id: c5d8e3f4-2a6b-4c7d-9e8f-7a6b5c4d3e2f
            request_id: d6e9f4a5-3b7c-4d8e-9f8a-7b6c5d4e3f2a

    ServiceUnavailable:
      description: 503 — subsistema interno indisponível
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          schema: { type: integer, example: 30 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

    GatewayTimeout:
      description: 504 — provedor não respondeu em 45s. **Sem cobrança.** Retry com mesma key é seguro.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: https://brasilcred.com.br/errors/gateway_timeout
            title: Upstream request timed out
            status: 504
            detail: "The data provider did not respond within 45 seconds. No charge was applied. Safe to retry."
            request_id: e7f0a5b6-4c8d-4e9f-8a7b-6c5d4e3f2a1b
