<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultas PRO — Consultas de Crédito Inteligentes</title>
    <meta name="description" content="Plataforma SaaS para consultas de crédito modulares e personalizáveis. Monte seu relatório, escolha os blocos e pague apenas pelo que usar." />
    <meta property="og:title" content="Consultas PRO" />
    <meta property="og:description" content="Consultas de crédito inteligentes e modulares" />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var k = localStorage.getItem("theme");
          var d = document.documentElement;
          d.classList.remove("light", "dark");
          if (k === "light" || k === "dark") {
            d.classList.add(k);
          } else if (k === "system") {
            d.classList.add(
              window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
            );
          } else {
            d.classList.add("dark");
          }
          d.style.colorScheme = d.classList.contains("dark") ? "dark" : "light";
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
