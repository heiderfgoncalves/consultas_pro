    <meta name="description" content="Centralize provedores, monte consultas sob medida, gere relatórios personalizados e distribua a experiência com sua marca, API e widget white-label." />

    <link rel="canonical" href="https://consultas.limpanome.pro/" />
    <script>
      (function () {
        try {
          var k = localStorage.getItem("theme");
          var d = document.documentElement;
          d.classList.remove("light", "dark");
          if (k === "light" || k === "dark") {
            d.classList.add(k);
          } else if (k === "system") {
            d.classList.add(
              window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
            );
          } else {
            d.classList.add("dark");
          }
          d.style.colorScheme = d.classList.contains("dark") ? "dark" : "light";
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
